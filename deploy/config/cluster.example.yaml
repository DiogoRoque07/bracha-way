# Shape of the cluster config. The real file is GENERATED by the keygen script
# (deploy/generated/, git-ignored) — never commit real keys.
n: 4
f: 1
nodes:
  - { id: 0, host: node0, nodePort: 7000, clientPort: 8000, publicKey: "<base64 X.509 Ed25519>" }
  - { id: 1, host: node1, nodePort: 7000, clientPort: 8000, publicKey: "<base64 X.509 Ed25519>" }
  - { id: 2, host: node2, nodePort: 7000, clientPort: 8000, publicKey: "<base64 X.509 Ed25519>" }
  - { id: 3, host: node3, nodePort: 7000, clientPort: 8000, publicKey: "<base64 X.509 Ed25519>" }
hmacKeys:            # one per unordered pair i<j, base64 of 32 random bytes
  "0-1": "<base64>"
  "0-2": "<base64>"
  "0-3": "<base64>"
  "1-2": "<base64>"
  "1-3": "<base64>"
  "2-3": "<base64>"
genesis:
  - { account: "<base64 X.509 public key of alice>", balance: 1000 }
  - { account: "<base64 X.509 public key of bob>", balance: 1000 }
wallet:
  submitFanout: 2     # in [f+1, n]; default f+1
  resendIntervalMs: 2000
  maxInFlight: 4       # pipelined unconfirmed transfers (FIFO kept by seq)
