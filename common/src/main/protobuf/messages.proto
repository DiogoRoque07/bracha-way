// Wire contract for bracha-way. FROZEN after Day 0: changes need approval from both other owners.
syntax = "proto3";

package tfd.pay;

option java_package = "tfd.pay.proto";
option java_multiple_files = true;

// ---------------------------------------------------------------------------
// Transfers (signed by the client)
// ---------------------------------------------------------------------------

// Account IDs (src, dst) are X.509-encoded Ed25519 public keys (PublicKey.getEncoded(), 44 bytes).
message Transfer {
  bytes  src    = 1;
  bytes  dst    = 2;
  uint64 amount = 3;
  uint64 seq    = 4;
}

// `transfer` holds the serialized Transfer EXACTLY as signed. Sign, verify and hash these bytes
// as they are; never re-serialize.
message SignedTransfer {
  bytes transfer  = 1;
  bytes signature = 2;  // Ed25519 by src over `transfer`
}

// Wire form of a BRB instance id = (src, seq). Java domain type: tfd.pay.common.model.TxId.
message TxRef {
  bytes  src = 1;
  uint64 seq = 2;
}

// ---------------------------------------------------------------------------
// Node <-> node
// ---------------------------------------------------------------------------

message Send  { TxRef id = 1; SignedTransfer tx = 2; }
message Echo  { TxRef id = 1; SignedTransfer tx = 2; }
message Ready { TxRef id = 1; SignedTransfer tx = 2; }

// Sent once, never put in the resend buffer.
message Ack { uint64 up_to = 1; }   // cumulative ACK of link_seq

message NodeMessage {
  oneof body {
    Send      send      = 1;
    Echo      echo      = 2;
    Ready     ready     = 3;
    Ack       ack       = 5;
  }
  reserved 4;  // was Heartbeat: no failure detector in the base system
}

// What actually goes on the wire between nodes (length-delimited).
message Frame {
  uint32 sender_id = 1;
  uint64 epoch     = 2;              // incarnation; always 0 in the base system (crash-recovery increment bumps it)
  uint64 link_seq  = 3;              // 0 for Ack-only frames (not retransmitted)
  repeated NodeMessage msgs = 4;     // batching: several messages per frame
  bytes  hmac      = 5;              // HMAC-SHA256 (pair key) over this Frame serialized WITHOUT field 5
}

// First message on every node-to-node connection.
message Hello {
  uint32 sender_id = 1;
  uint64 epoch     = 2;
  bytes  hmac      = 3;              // HMAC-SHA256 (pair key) over fields 1..2
}

// ---------------------------------------------------------------------------
// Client <-> node
// ---------------------------------------------------------------------------
// Versions (docs/STACK.md §3.2): next_seq = next[a], the number of a's own transfers applied (FIFO);
// version = ver[a], the number of applied transfers touching a (debits + credits).

message HistoryQuery {
  bytes  account  = 1;
  uint64 from_seq = 2;   // only a's own transfers with seq >= from_seq; credits are included in full
}

message ClientRequest {
  uint64 request_id = 1;
  oneof body {
    SignedTransfer transfer     = 2;
    TxRef          tx_status    = 3;
    bytes          account_view = 4;  // account id
    HistoryQuery   history      = 5;
    bool           node_status  = 6;
  }
}

enum TransferResult {
  ACCEPTED        = 0;  // valid signature/format; broadcast in progress (may be pending at this node)
  ALREADY_APPLIED = 1;  // seq < next[src] and the SAME transfer was applied at that seq
  STALE_SEQ       = 2;  // seq < next[src] and a DIFFERENT transfer was applied: the wallet is outdated
  REJECTED        = 3;  // bad signature or malformed
}

message TransferReply {
  TransferResult result   = 1;
  uint64         next_seq = 2;       // this node's next[src]
  SignedTransfer applied  = 3;       // set when result == STALE_SEQ
}

enum TxStatus {
  UNKNOWN = 0;  // not delivered here yet; NOT "failed"
  PENDING = 1;  // delivered, waiting on earlier seq (FIFO) or on balance
  APPLIED = 2;
}

message TxStatusReply {
  TxStatus status   = 1;
  uint64   next_seq = 2;
}

message AccountViewReply {
  uint64 balance  = 1;
  uint64 next_seq = 2;
  uint64 version  = 3;
}

message HistoryReply { repeated SignedTransfer applied = 1; }
message NodeStatus   { uint32 node_id = 1; uint64 applied_count = 2; }

message ClientResponseBody {
  uint64 request_id = 1;
  uint32 node_id    = 2;
  oneof body {
    TransferReply    transfer     = 3;
    TxStatusReply    tx_status    = 4;
    AccountViewReply account_view = 5;
    HistoryReply     history      = 6;
    NodeStatus       node_status  = 7;
    string           error        = 8;
  }
}

// `body` is a serialized ClientResponseBody; the node signs those exact bytes with its Ed25519 key.
message ClientResponse {
  bytes body           = 1;
  bytes node_signature = 2;
}
